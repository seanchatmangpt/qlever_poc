[package]
name = "qlever-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "qlever"
path = "src/lib.rs"

[[example]]
name = "query"
path = "examples/query.rs"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.0"
urlencoding = "2.0"
thiserror = "1.0"
async-trait = "0.1"
parking_lot = "0.12"
