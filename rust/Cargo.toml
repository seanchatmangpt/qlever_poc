[package]
name = "qlever-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "qlever"
path = "src/lib.rs"

[[example]]
name = "query"
path = "examples/query.rs"

[dependencies]
# Error handling
thiserror = "1.0"

# High-performance locking for concurrent triple store access
parking_lot = "0.12"

# Optional: For future FFI integration with C++
# libqlever = { path = "../target/libqlever" }  # When C++ bindings are ready
