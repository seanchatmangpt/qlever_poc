[package]
name = "qlever-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "qlever"
path = "src/lib.rs"

[[example]]
name = "query"
path = "examples/query.rs"

[[bin]]
name = "ffi_benchmark"
path = "benches/ffi_benchmark.rs"

[dependencies]
# Error handling
thiserror = "1.0"

# High-performance locking for concurrent triple store access
parking_lot = "0.12"

# JSON parsing for QLever query results (FFI)
serde_json = "1.0"

# WASM support
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
# WASM support for web deployment
wasm = ["wasm-bindgen", "serde", "console_error_panic_hook"]

# Phase 1: Direct C++ integration via FFI (enables libqlever API)
# Requires: libqlever.so/dylib installed and accessible to linker
libqlever = ["serde"]
