name: FPV Gate (EPIC 10.3 Agent 2)

# This workflow implements the Formal Property Verification gate
# that blocks all code agents (1, 3-10) until FPV witness is obtained.

on:
  push:
    branches:
      - claude/**  # Run on all Claude feature branches
    paths:
      - 'src/engine/**'
      - 'src/util/JoinAlgorithms/**'
      - 'test/fpv/**'
      - '.github/workflows/fpv_gate.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/engine/**'
      - 'src/util/JoinAlgorithms/**'
      - 'test/fpv/**'
  workflow_dispatch:  # Manual trigger
    inputs:
      saturation_level:
        description: 'Saturation level (quick/medium/full)'
        required: false
        default: 'quick'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==========================================================================
  # Kani Bounded Model Checking (2 hours)
  # ==========================================================================
  kani_verification:
    name: Kani BMC (Arithmetic Safety)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup

      - name: Cache Kani artifacts
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            test/fpv/kani/target/
          key: kani-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Kani verification
        working-directory: test/fpv/kani
        run: |
          echo "=== Running Kani Bounded Model Checking ==="
          cargo kani --harness verify_all --output-format terse | tee kani_output.txt

      - name: Verify all harnesses passed
        working-directory: test/fpv/kani
        run: |
          if grep -q "VERIFICATION:- SUCCESSFUL" kani_output.txt; then
            echo "✓ All Kani harnesses verified successfully"
          else
            echo "✗ Kani verification failed"
            exit 1
          fi

      - name: Upload Kani results
        uses: actions/upload-artifact@v3
        with:
          name: kani-results
          path: test/fpv/kani/kani_output.txt

  # ==========================================================================
  # RapidCheck Property-Based Testing (12 hours for full saturation)
  # ==========================================================================
  rapidcheck_join:
    name: RapidCheck Join (Semantic Equivalence)
    runs-on: ubuntu-latest
    timeout-minutes: 720  # 12 hours

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgtest-dev

      - name: Cache CMake build
        uses: actions/cache@v3
        with:
          path: build/
          key: cmake-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -G Ninja

      - name: Build FPV tests
        run: |
          cd build
          ninja fpv_rapidcheck_join

      - name: Determine saturation level
        id: saturation
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            LEVEL="${{ github.event.inputs.saturation_level }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            LEVEL="full"
          else
            LEVEL="quick"
          fi

          case "$LEVEL" in
            quick)   MAX_SUCCESS=10000 ;;
            medium)  MAX_SUCCESS=1000000 ;;
            full)    MAX_SUCCESS=1000000000 ;;
            *)       MAX_SUCCESS=10000 ;;
          esac

          echo "level=$LEVEL" >> $GITHUB_OUTPUT
          echo "max_success=$MAX_SUCCESS" >> $GITHUB_OUTPUT

      - name: Run RapidCheck Join tests
        run: |
          cd build
          ./test/fpv/fpv_rapidcheck_join \
            --rc-seed=42 \
            --rc-max-success=${{ steps.saturation.outputs.max_success }} \
            | tee rapidcheck_join_output.txt

      - name: Upload RapidCheck Join results
        uses: actions/upload-artifact@v3
        with:
          name: rapidcheck-join-results
          path: build/rapidcheck_join_output.txt

  rapidcheck_filter:
    name: RapidCheck Filter (Semantic Equivalence)
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgtest-dev

      - name: Cache CMake build
        uses: actions/cache@v3
        with:
          path: build/
          key: cmake-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -G Ninja

      - name: Build FPV tests
        run: |
          cd build
          ninja fpv_rapidcheck_filter

      - name: Determine saturation level
        id: saturation
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            LEVEL="${{ github.event.inputs.saturation_level }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            LEVEL="full"
          else
            LEVEL="quick"
          fi

          case "$LEVEL" in
            quick)   MAX_SUCCESS=10000 ;;
            medium)  MAX_SUCCESS=1000000 ;;
            full)    MAX_SUCCESS=1000000000 ;;
            *)       MAX_SUCCESS=10000 ;;
          esac

          echo "level=$LEVEL" >> $GITHUB_OUTPUT
          echo "max_success=$MAX_SUCCESS" >> $GITHUB_OUTPUT

      - name: Run RapidCheck Filter tests
        run: |
          cd build
          ./test/fpv/fpv_rapidcheck_filter \
            --rc-seed=42 \
            --rc-max-success=${{ steps.saturation.outputs.max_success }} \
            | tee rapidcheck_filter_output.txt

      - name: Upload RapidCheck Filter results
        uses: actions/upload-artifact@v3
        with:
          name: rapidcheck-filter-results
          path: build/rapidcheck_filter_output.txt

  rapidcheck_indexscan:
    name: RapidCheck IndexScan (Semantic Equivalence)
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgtest-dev

      - name: Cache CMake build
        uses: actions/cache@v3
        with:
          path: build/
          key: cmake-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -G Ninja

      - name: Build FPV tests
        run: |
          cd build
          ninja fpv_rapidcheck_indexscan

      - name: Determine saturation level
        id: saturation
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            LEVEL="${{ github.event.inputs.saturation_level }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            LEVEL="full"
          else
            LEVEL="quick"
          fi

          case "$LEVEL" in
            quick)   MAX_SUCCESS=10000 ;;
            medium)  MAX_SUCCESS=1000000 ;;
            full)    MAX_SUCCESS=1000000000 ;;
            *)       MAX_SUCCESS=10000 ;;
          esac

          echo "level=$LEVEL" >> $GITHUB_OUTPUT
          echo "max_success=$MAX_SUCCESS" >> $GITHUB_OUTPUT

      - name: Run RapidCheck IndexScan tests
        run: |
          cd build
          ./test/fpv/fpv_rapidcheck_indexscan \
            --rc-seed=42 \
            --rc-max-success=${{ steps.saturation.outputs.max_success }} \
            | tee rapidcheck_indexscan_output.txt

      - name: Upload RapidCheck IndexScan results
        uses: actions/upload-artifact@v3
        with:
          name: rapidcheck-indexscan-results
          path: build/rapidcheck_indexscan_output.txt

  # ==========================================================================
  # MC/DC Coverage Analysis (30 minutes, parallel with RapidCheck)
  # ==========================================================================
  mcdc_coverage:
    name: MC/DC Coverage Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgtest-dev lcov python3

      - name: Configure CMake with coverage
        run: |
          mkdir -p build
          cd build
          cmake .. -G Ninja -DENABLE_FPV_COVERAGE=ON

      - name: Build FPV tests with coverage
        run: |
          cd build
          ninja fpv_rapidcheck_join fpv_rapidcheck_filter fpv_rapidcheck_indexscan

      - name: Run tests and collect coverage
        run: |
          cd build
          ../test/fpv/mcdc_instrumentation.sh
          ctest -R FPV_ --output-on-failure
          lcov --capture --directory . --output-file coverage.info

      - name: Generate MC/DC report
        run: |
          ./test/fpv/mcdc_report.py build/coverage.info | tee mcdc_report.txt

      - name: Verify MC/DC coverage >= 100%
        run: |
          if grep -q "MC/DC COVERAGE REQUIREMENT MET" mcdc_report.txt; then
            echo "✓ MC/DC coverage requirement met"
          else
            echo "✗ MC/DC coverage requirement not met"
            exit 1
          fi

      - name: Upload MC/DC report
        uses: actions/upload-artifact@v3
        with:
          name: mcdc-coverage-report
          path: mcdc_report.txt

  # ==========================================================================
  # FPV Witness Generation (after all verifications complete)
  # ==========================================================================
  generate_witness:
    name: Generate FPV Witness
    needs: [kani_verification, rapidcheck_join, rapidcheck_filter, rapidcheck_indexscan, mcdc_coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          cargo install b3sum

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/

      - name: Generate FPV witness
        run: |
          ./test/fpv/generate_witness.sh

      - name: Upload FPV witness
        uses: actions/upload-artifact@v3
        with:
          name: fpv-witness
          path: |
            fpv_witness.receipt
            fpv_witness.sig

      - name: Display witness
        run: |
          echo "=== FPV WITNESS ==="
          cat fpv_witness.receipt

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const witness = fs.readFileSync('fpv_witness.receipt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## FPV Gate: PASSED ✓\n\nFormal Property Verification complete. All agents (1, 3-10) are now unlocked.\n\n<details><summary>FPV Witness</summary>\n\n\`\`\`\n${witness}\n\`\`\`\n\n</details>`
            })

      - name: Set gate status
        run: |
          echo "FPV_GATE_STATUS=PASSED" >> $GITHUB_ENV
          echo "✓ FPV Gate PASSED - Agents 1, 3-10 UNLOCKED"
