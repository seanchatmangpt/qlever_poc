name: Generate API Documentation

on:
  push:
    branches: [master]
    paths:
      - 'src/**/*.h'
      - 'src/**/*.cpp'
      - 'Doxyfile'
      - '.github/workflows/doxygen.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Doxygen Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate documentation
        run: doxygen Doxyfile
        working-directory: ${{ github.workspace }}

      - name: Verify output
        run: |
          if [ ! -d "docs/api/html" ]; then
            echo "❌ Doxygen failed to generate documentation"
            exit 1
          fi
          echo "✓ Documentation generated successfully"
          ls -la docs/api/html/ | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: doxygen-docs
          path: docs/api/html/
          retention-days: 30
        if: always()

      - name: Setup Pages
        uses: actions/configure-pages@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v2
        with:
          path: 'docs/api/html'
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'

  deploy:
    name: Deploy to GitHub Pages
    needs: generate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

  notify:
    name: Notify on Completion
    needs: generate
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Comment on commit
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ needs.generate.result }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const artifacts = status === 'success'
              ? '[📖 View Docs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
              : 'Failed to generate';

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `${emoji} API documentation generation ${status.toUpperCase()} - ${artifacts}`
            });
