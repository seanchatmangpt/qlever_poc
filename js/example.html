<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QLever Browser Client Example</title>
  <style>
    body { font-family: monospace; max-width: 1200px; margin: 0 auto; padding: 20px; }
    .section { margin: 20px 0; padding: 10px; background: #f0f0f0; border-radius: 4px; }
    button { padding: 8px 16px; margin: 5px; cursor: pointer; }
    .results { background: white; padding: 10px; margin: 10px 0; max-height: 300px; overflow-y: auto; }
    .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>QLever Browser Client</h1>
  <p>Connect to QLever instance and execute SPARQL queries</p>

  <div class="section">
    <h2>Connection</h2>
    <input type="text" id="serverUrl" placeholder="Server URL" value="http://localhost:3000">
    <input type="text" id="indexPath" placeholder="Index Path" value="./test_index">
    <button onclick="openIndex()">Open Index</button>
    <button onclick="closeIndex()">Close Index</button>
    <div id="connectionStatus" class="status" style="display:none;"></div>
  </div>

  <div class="section">
    <h2>SPARQL Query</h2>
    <textarea id="sparqlQuery" cols="80" rows="4">SELECT ?s ?p ?o WHERE { ?s ?p ?o } LIMIT 10</textarea>
    <button onclick="executeQuery()">Execute Query</button>
    <button onclick="executeWithTimings()">Execute with Timings</button>
    <div id="queryStatus" class="status" style="display:none;"></div>
    <div class="results" id="queryResults"></div>
  </div>

  <div class="section">
    <h2>Query Planning & Execution</h2>
    <input type="text" id="planQuery" placeholder="SPARQL Query" value="SELECT ?s WHERE { ?s ?p ?o }">
    <button onclick="parsePlan()">Parse & Plan</button>
    <button onclick="executePlan()">Execute Plan</button>
    <div id="planStatus" class="status" style="display:none;"></div>
    <div class="results" id="planResults"></div>
  </div>

  <div class="section">
    <h2>Caching</h2>
    <input type="text" id="cacheName" placeholder="Cache Name" value="my_results">
    <input type="text" id="cacheQuery" placeholder="SPARQL Query" value="SELECT ?s WHERE { ?s ?p ?o } LIMIT 100">
    <button onclick="pinResult()">Pin Result</button>
    <button onclick="eraseResult()">Erase Result</button>
    <button onclick="clearCache()">Clear Cache</button>
    <div id="cacheStatus" class="status" style="display:none;"></div>
  </div>

  <div class="section">
    <h2>Materialized Views</h2>
    <input type="text" id="viewName" placeholder="View Name" value="active_subjects">
    <input type="text" id="viewQuery" placeholder="View Query" value="SELECT ?s (COUNT(*) AS ?count) WHERE { ?s ?p ?o } GROUP BY ?s">
    <button onclick="writeView()">Write View</button>
    <button onclick="loadView()">Load View</button>
    <div id="viewStatus" class="status" style="display:none;"></div>
  </div>

  <div class="section">
    <h2>Text Search</h2>
    <input type="text" id="searchQuery" placeholder="Search Term" value="example">
    <input type="number" id="searchLimit" placeholder="Limit" value="50">
    <button onclick="textSearch()">Search</button>
    <div id="searchStatus" class="status" style="display:none;"></div>
    <div class="results" id="searchResults"></div>
  </div>

  <script src="browser-client.js"></script>
  <script>
    let client = null;
    let currentPlanId = null;

    function showStatus(elementId, message, isSuccess = true) {
      const elem = document.getElementById(elementId);
      elem.textContent = message;
      elem.className = 'status ' + (isSuccess ? 'success' : 'error');
      elem.style.display = 'block';
    }

    async function openIndex() {
      try {
        const serverUrl = document.getElementById('serverUrl').value;
        const indexPath = document.getElementById('indexPath').value;
        client = new QleverBrowserClient(serverUrl);
        const result = await client.open(indexPath);
        showStatus('connectionStatus', `✓ Index opened: ${indexPath}`, true);
      } catch (error) {
        showStatus('connectionStatus', `✗ Error: ${error.message}`, false);
      }
    }

    async function closeIndex() {
      try {
        if (!client) throw new Error('No connection');
        await client.close();
        showStatus('connectionStatus', '✓ Index closed', true);
        client = null;
      } catch (error) {
        showStatus('connectionStatus', `✗ Error: ${error.message}`, false);
      }
    }

    async function executeQuery() {
      try {
        if (!client) throw new Error('Not connected');
        const sparql = document.getElementById('sparqlQuery').value;
        const results = await client.query(sparql);
        showStatus('queryStatus', `✓ Query executed: ${results.results.bindings.length} results`, true);
        displayResults('queryResults', results);
      } catch (error) {
        showStatus('queryStatus', `✗ Error: ${error.message}`, false);
      }
    }

    async function executeWithTimings() {
      try {
        if (!client) throw new Error('Not connected');
        const sparql = document.getElementById('sparqlQuery').value;
        const results = await client.query(sparql, true);
        let message = `✓ Query executed: ${results.results.bindings.length} results`;
        if (results.timings) {
          message += ` (${results.timings.query_ms}ms total)`;
        }
        showStatus('queryStatus', message, true);
        displayResults('queryResults', results);
      } catch (error) {
        showStatus('queryStatus', `✗ Error: ${error.message}`, false);
      }
    }

    async function parsePlan() {
      try {
        if (!client) throw new Error('Not connected');
        const sparql = document.getElementById('planQuery').value;
        const result = await client.parseAndPlan(sparql);
        currentPlanId = result.planId;
        showStatus('planStatus', `✓ Plan created: ${result.planId}`, true);
        document.getElementById('planResults').innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
      } catch (error) {
        showStatus('planStatus', `✗ Error: ${error.message}`, false);
      }
    }

    async function executePlan() {
      try {
        if (!client) throw new Error('Not connected');
        if (!currentPlanId) throw new Error('No plan available - parse first');
        const results = await client.executePlan(currentPlanId);
        showStatus('planStatus', `✓ Plan executed: ${results.results.bindings.length} results`, true);
        displayResults('planResults', results);
      } catch (error) {
        showStatus('planStatus', `✗ Error: ${error.message}`, false);
      }
    }

    async function pinResult() {
      try {
        if (!client) throw new Error('Not connected');
        const name = document.getElementById('cacheName').value;
        const query = document.getElementById('cacheQuery').value;
        await client.pinResult(name, query);
        showStatus('cacheStatus', `✓ Result pinned: ${name}`, true);
      } catch (error) {
        showStatus('cacheStatus', `✗ Error: ${error.message}`, false);
      }
    }

    async function eraseResult() {
      try {
        if (!client) throw new Error('Not connected');
        const name = document.getElementById('cacheName').value;
        await client.eraseResult(name);
        showStatus('cacheStatus', `✓ Result erased: ${name}`, true);
      } catch (error) {
        showStatus('cacheStatus', `✗ Error: ${error.message}`, false);
      }
    }

    async function clearCache() {
      try {
        if (!client) throw new Error('Not connected');
        await client.clearCache();
        showStatus('cacheStatus', '✓ Cache cleared', true);
      } catch (error) {
        showStatus('cacheStatus', `✗ Error: ${error.message}`, false);
      }
    }

    async function writeView() {
      try {
        if (!client) throw new Error('Not connected');
        const name = document.getElementById('viewName').value;
        const query = document.getElementById('viewQuery').value;
        await client.writeMaterializedView(name, query);
        showStatus('viewStatus', `✓ View created: ${name}`, true);
      } catch (error) {
        showStatus('viewStatus', `✗ Error: ${error.message}`, false);
      }
    }

    async function loadView() {
      try {
        if (!client) throw new Error('Not connected');
        const name = document.getElementById('viewName').value;
        await client.loadMaterializedView(name);
        showStatus('viewStatus', `✓ View loaded: ${name}`, true);
      } catch (error) {
        showStatus('viewStatus', `✗ Error: ${error.message}`, false);
      }
    }

    async function textSearch() {
      try {
        if (!client) throw new Error('Not connected');
        const query = document.getElementById('searchQuery').value;
        const limit = parseInt(document.getElementById('searchLimit').value);
        const results = await client.textSearch(query, limit);
        showStatus('searchStatus', `✓ Found ${results.results.bindings.length} matches`, true);
        displayResults('searchResults', results);
      } catch (error) {
        showStatus('searchStatus', `✗ Error: ${error.message}`, false);
      }
    }

    function displayResults(elementId, results) {
      const html = `<pre>${JSON.stringify(results, null, 2)}</pre>`;
      document.getElementById(elementId).innerHTML = html;
    }
  </script>
</body>
</html>
