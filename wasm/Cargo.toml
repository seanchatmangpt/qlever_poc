[package]
name = "qlever-wasm"
version = "0.1.0"
edition = "2021"
description = "QLever WebAssembly bindings for JavaScript/Node.js"
license = "MIT"
repository = "https://github.com/ad-freiburg/qlever"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
wasm-bindgen-futures = "0.4.42"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "Window",
    "Request",
    "Response",
    "Headers",
    "MessageEvent",
    "WebSocket",
] }
js-sys = "0.3"
async-trait = "0.1"
futures = "0.3"
thiserror = "1.0"
log = "0.4"
wasm-logger = "0.2"
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]
wasm_libqlever = []  # Feature flag for libqlever WASM compilation

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
